<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Inscription</title>
    <link rel="stylesheet" href="../assets/css/styles.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/js-sha256@0.9.0/src/sha256.min.js"></script>
    <script src="../assets/js/componentsLoader.js"></script>
    <script src="../assets/js/header.js" type="module"></script>
</head>

<body class="bg-light">
    <div id="printHeader"></div>

    <main class="container d-flex justify-content-center align-items-center py-3">
        <div class="bg-white p-3 rounded shadow w-100" style="max-width: 900px;">
            <h2 class="mb-4 text-center">Créer votre compte</h2>

            <form id="registerForm" novalidate style="background-color: transparent !important;">
                <div class="mb-3">
                    <h5 class="mb-3">Identité</h5>
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label for="prenom" class="form-label fw-semibold">Prénom</label>
                            <input required type="text" id="prenom" name="prenom" class="form-control" placeholder="Saisir votre prénom" maxlength="20">
                            <div id="prenomErreur" class="form-text text-danger"></div>
                        </div>
                        <div class="col-md-6">
                            <label for="nom" class="form-label fw-semibold">Nom</label>
                            <input required type="text" id="nom" name="nom" class="form-control" placeholder="Saisir votre nom" maxlength="40">
                            <div id="nomErreur" class="form-text text-danger"></div>
                        </div>
                        <div class="col-md-6">
                            <label for="civilite" class="form-label fw-semibold">Civilité</label>
                            <select required id="civilite" name="civilite" class="form-control mt-2" style="min-height: 50px;">
                                <option value="">-- Sélectionner --</option>
                                <option value="2">Monsieur</option>
                                <option value="1">Madame</option>
                            </select>
                            <div id="civiliteErreur" class="form-text text-danger"></div>
                        </div>
                        <div class="col-md-6">
                            <label for="date_naissance" class="form-label fw-semibold">Date de naissance</label>
                            <input required type="date" id="date_naissance" name="date_naissance" class="form-control">
                        </div>
                    </div>
                </div>

                <div class="mb-3">
                    <h5 class="mb-3">Coordonnées</h5>
                    <div class="row g-3">
                        <div class="col-md-12">
                            <label for="mel" class="form-label fw-semibold">Adresse email</label>
                            <input required type="email" id="mel" name="mel" class="form-control" placeholder="exemple@mail.com" maxlength="100">
                            <div id="melErreur" class="form-text text-danger"></div>
                        </div>
                    </div>
                </div>

                <div class="mb-3">
                    <h5 class="mb-3">Sécurité</h5>
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label for="mdp" class="form-label fw-semibold">Mot de passe</label>
                            <input required type="password" id="mdp" name="mdp" class="form-control" placeholder="Mot de passe sécurisé" maxlength="30">
                            <div id="mdpErreur" class="form-text text-danger"></div>
                        </div>
                        <div class="col-md-6">
                            <label for="mdp2" class="form-label fw-semibold">Confirmer le mot de passe</label>
                            <input required type="password" id="mdp2" name="mdp2" class="form-control" placeholder="Répétez le mot de passe" maxlength="30">
                            <div id="mdp2Erreur" class="form-text text-danger"></div>
                        </div>
                    </div>
                </div>

                <div id="MessageErreur" class="alert alert-danger py-2 px-3 small text-center" hidden>Message d'erreur</div>

                <div class="d-flex justify-content-between mt-3">
                    <button id="loginBtn" type="button" class="btn btn btn-outline-success w-50 me-2" id="createAccountBtn">Se connecter</button>
                    <input type="submit" name="valider" value="S'inscrire" class="btn btn-success w-50">
                </div>
            </form>
        </div>
    </main>

    <footer id="printFooter" class="mt-4"></footer>

    <script type="module" src="../assets/js/register.js"></script>
    <script>
        componentsLoader("../components/header.html", "printHeader");
        componentsLoader("../components/footer.html", "printFooter");
    </script>
</body>

</html>
