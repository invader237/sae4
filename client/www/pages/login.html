<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Connexion</title>
    <link rel="stylesheet" href="../assets/css/styles.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/js-sha256@0.9.0/src/sha256.min.js"></script>
    <script src="../assets/js/componentsLoader.js"></script>
    <script src="../assets/js/header.js" type="module"></script>
</head>

<body>
    <div id="printHeader"></div>

    <form id="loginForm">

        <label for="email">Email</label>
        <input required type="email" id="email" name="email" placeholder="Saisir votre email" maxlength="20">

        <label for="motdepasse">Mot de passe :</label>
        <input required type="password" id="password" name="password" placeholder="Saisir votre mot de passe"
            maxlength="20">

        <p id="error" style="color: red" hidden>Message d'erreur</p>

        <a href="../pages/register.html" class="form_button">Créer un compte</a>
        <input type="submit" value="Connexion" class="form_button">
    </form>

    <footer id="printFooter"></footer>
</body>

<script type="module" src="../assets/js/login.js"></script>
<script>
    componentsLoader("../components/header.html", "printHeader");
    componentsLoader("../components/footer.html", "printFooter");
</script>

</html>
