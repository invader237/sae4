<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Connexion</title>
    <link rel="stylesheet" href="../assets/css/styles.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/js-sha256@0.9.0/src/sha256.min.js"></script>
    <script src="../assets/js/componentsLoader.js"></script>
    <script src="../assets/js/header.js" type="module"></script>
</head>

<body class="bg-light">
    <div id="printHeader"></div>

    <main class="container d-flex justify-content-center align-items-center" style="min-height: 80vh;">
        <div class="bg-white p-5 rounded shadow w-100" style="max-width: 400px;">
            <h2 class="mb-4 text-center">Connexion</h2>

            <form id="loginForm" novalidate style="background-color: transparent !important;">
                <div class="mb-3">
                    <label for="email" class="form-label fw-semibold">Email</label>
                    <input required type="email" id="email" name="email" class="form-control"
                        placeholder="Saisir votre email" maxlength="50">
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label fw-semibold">Mot de passe</label>
                    <input required type="password" id="password" name="password" class="form-control"
                        placeholder="Saisir votre mot de passe" maxlength="50">
                </div>

                <div id="error" class="alert alert-danger py-2 px-3 small text-center" hidden></div>

                <div class="row d-flex justify-content-center">
                    <div class="col-sm d-flex justify-content-center mt-2">
                        <button id="createAccountBtn" type="button" class="btn btn-outline-success h-100 w-100" id="createAccountBtn">Créer un compte</button>
                    </div>
                    <div class="col-sm d-flex justify-content-center mt-2">
                        <button type="submit" name="valider" class="btn btn-success h-100 w-100">Se connecter</button>
                    </div>
                </div>
            </form>
        </div>
    </main>

    <footer id="printFooter" class="mt-5"></footer>

    <script type="module" src="../assets/js/login.js"></script>
    <script>
        componentsLoader("../components/header.html", "printHeader");
        componentsLoader("../components/footer.html", "printFooter");
    </script>
</body>

</html>
