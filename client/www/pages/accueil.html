<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title></title>
    <link rel="stylesheet" href="/assets/css/styles.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="/assets/js/componentsLoader.js"></script>
</head>

<body>
    <div id="printHeader"></div>

    <div class="container flex-column d-flex justify-content-center align-items-center">
        <form class="container d-flex justify-content-center mb-4" id="searchForm">
            <div class="row g-2">
                <div class="col-12">
                    <label for="search" class="visually-hidden">Recherche</label>
                    <input type="text" id="search" name="search" class="form-control"
                        placeholder="Rechercher un produit...">
                </div>

                <div class="col-lg-3 col-md-12 col-sm-6">
                    <label for="category" class="visually-hidden">Catégorie</label>
                    <select id="category" name="category" class="form-select w-100 h-100 text-wrap"
                        style="min-width: 150px; white-space: normal;">
                        <option value="">Catégorie</option>
                        <option value="1">Bonnet</option>
                        <option value="2">Pull</option>
                        <option value="3">Gants</option>
                        <option value="4">Chaussettes</option>
                        <option value="5">Décoration</option>
                        <option value="6">Schysautre</option>
                    </select>
                </div>

                <div class="col-lg-3 col-md-12 col-sm-6">
                    <label for="color" class="visually-hidden">Couleur</label>
                    <select id="color" name="color" class="form-select w-100 h-100 text-wrap">
                        <option value="">Couleur</option>
                        <option value="red">Rouge</option>
                        <option value="blue">Bleu</option>
                        <option value="green">Vert</option>
                        <option value="black">Noir</option>
                        <option value="white">Blanc</option>
                    </select>
                </div>

                <div class="col-lg-3 col-md-12 col-sm-6">
                    <label for="size" class="visually-hidden">Taille</label>
                    <select id="size" name="size" class="form-select w-100 h-100 text-wrap">
                        <option value="">Taille</option>
                        <option value="s">S</option>
                        <option value="m">M</option>
                        <option value="l">L</option>
                        <option value="xl">XL</option>
                    </select>
                </div>

                <div class="col-lg-3 col-md-12 col-sm-6">
                    <button type="submit" class="btn w-100"
                        style="background-color: #BA0324; color: white;">Rechercher</button>
                </div>
            </div>
        </form>

        <div class="container-fluid">
            <div id="productsContainer" class="row g-4">
            </div>
        </div>
    </div>
    <script src="../assets/js/accueil.js" type="module"></script>
    <footer id="printFooter"></footer>
</body>
<script>
    componentsLoader("/components/header.html", "printHeader");
    componentsLoader("/components/footer.html", "printFooter");
</script>

</html>
