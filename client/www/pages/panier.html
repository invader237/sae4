<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panier</title>
    <link rel="stylesheet" href="../assets/css/styles.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="../assets/js/componentsLoader.js"></script>
    <script src="../assets/js/header.js"></script>
</head>
<body class="bg-light">

    <div id="printHeader"></div>

    <main class="container py-5">
        <div class="text-center mb-5 p-4 bg-white rounded shadow-sm">
            <h1 class="display-4 fw-bold text-dark">Votre panier</h1>
            <p class="lead text-muted">Voici les articles que vous avez ajoutés. Vous pouvez les modifier ou procéder au paiement.</p>
        </div>

        <div id="panier" class="d-flex flex-column gap-3"></div>

        <div id="footer" class="card p-4 mt-5 bg-white shadow-sm border-0" style="display: none;">
            <div class="d-flex flex-column flex-md-row justify-content-between align-items-center">
                <h4 class="text-d mb-3 mb-md-0">Prix total : <span id="prixTotal">0</span> €</h4>
                <div class="d-flex gap-2">
                    <button id="clear" class="btn btn-outline-danger btn-lg border-danger text-danger">Vider le panier</button>
                    <button id="payer" class="btn btn-success btn-lg" style="background-color: #2e8b57; border-color: #2e8b57;">Payer</button>
                </div>
            </div>
        </div>
    </main>

    <footer id="printFooter"></footer>

    <script src="../assets/js/panier.js" type="module"></script>
    <script>
        componentsLoader("../components/header.html", "printHeader");
        componentsLoader("../components/footer.html", "printFooter");
        handleNavbar(991.9);
    </script>
</body>
</html>
