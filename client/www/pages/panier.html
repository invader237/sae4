<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panier</title>
    <link rel="stylesheet" href="../assets/css/styles.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="../assets/js/componentsLoader.js"></script>
</head>
<body class="bg-light">

    <div id="printHeader"></div>

    <main class="container py-5">
        <h1 class="mb-4 text-center">Votre panier</h1>
        <div id="panier" class="d-flex flex-column gap-3"></div>

        <div id="footer" class="card p-3 mt-4 shadow-sm" style="display: none;">
            <div class="d-flex justify-content-between align-items-center flex-wrap">
                <h4 class="mb-3 mb-md-0">Prix total : <span id="prixTotal">0</span> €</h4>
                <div class="d-flex gap-2">
                    <button id="clear" class="btn btn-outline-danger">Vider le panier</button>
                    <button id="payer" class="btn btn-success">Payer</button>
                </div>
            </div>
        </div>
    </main>

    <footer id="printFooter"></footer>

    <script src="../assets/js/panier.js" type="module"></script>
    <script>
        componentsLoader("../components/header.html", "printHeader");
        componentsLoader("../components/footer.html", "printFooter");
    </script>
</body>
</html>
