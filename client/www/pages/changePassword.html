<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title></title>
        <link rel="stylesheet" href="../assets/css/styles.css" />
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous" />
        <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/js-sha256@0.9.0/src/sha256.min.js"></script>
        <script src="../assets/js/componentsLoader.js"></script>
        <script src="../assets/js/changePassword.js" type="module"></script>
    </head>
    <body>
        <div id="printHeader"></div>

        <form id="changePasswordForm">

            <label for="oldPassword">Ancient mot de passe:</label>
            <input required type="password" id="oldPassword" name="oldPassword" placeholder="Saisir votre mot de passe"
                maxlength="20">

            <label for="password">Nouveau mot de passe :</label>
            <input required type="password" id="password" name="password" placeholder="Saisir votre mot de passe"
                maxlength="20">


            <label for="confirmPassword">Confirmation :</label>
            <input required type="password" id="confirmPassword" name="confirmPassword" placeholder="Saisir votre mot de passe"
                maxlength="20">

            <p id="error" style="color: red" hidden>Message d'erreur</p>

            <input type="submit" value="Changer le mot de passe" class="form_button">
        </form>
    
        <footer id="printFooter"></footer>
    </body>
</html>
