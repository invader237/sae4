<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Commande</title>
    <link rel="stylesheet" href="../assets/css/styles.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="../assets/js/componentsLoader.js"></script>
    <script src="../assets/js/header.js"></script>
    <script src="https://www.paypal.com/sdk/js?client-id=Ad3yDSe5rzqqIQ2U8Y6jmKA6ytYEXCBcn_K3m6-oBSzqV5ZsGoURSe3l4vsasgbFAKdob4QenNd0c7Wj&currency=EUR"></script>
</head>
<body class="bg-light">
    <div id="printHeader"></div>

    <div class="container py-5">
        <div class="row g-5">

            <div class="col-lg-6">
                <div class="bg-white rounded shadow p-4 mb-4">
                    <h2 class="fw-bold mb-4">Articles commandés</h2>
                    <ul id="orderSummaryList" class="list-group overflow-auto mb-4" style="height: 432px;"></ul>
                    <div class="border-top pt-3">
                        <div class="d-flex justify-content-between">
                            <span class="fw-bold">Total articles :</span>
                            <span class="fw-bold"><span id="prixTotal">0</span> €</span>
                        </div>
                    </div>
                </div>

                <div class="bg-white rounded shadow p-4 mb-4">
                    <h2 class="fw-bold mb-3">Type de livraison</h2>
                    <select class="form-select" id="livraison" style="min-height: 40px;">
                        <option value="">Chargement en cours</option>
                    </select>
                </div>

                <div class="bg-white rounded shadow p-4 mb-4">
                    <h2 class="fw-bold mb-4">Résumé de paiement</h2>
                    <div class="d-flex justify-content-between mt-2">
                        <span class="fw-bold">Frais de livraison :</span>
                        <span class="fw-bold"><span id="livraisonFrais">0</span> €</span>
                    </div>
                    <div class="d-flex justify-content-between mt-3">
                        <span class="fw-bold fs-5">Total à payer :</span>
                        <span class="fw-bold fs-5 text-success"><span id="totalAPayer">0</span> €</span>
                    </div>
                </div>
            </div>

            <div class="col-lg-6">
                <div class="bg-white rounded shadow p-4 mb-4">
                    <h2 class="fw-bold mb-4">Informations client</h2>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-semibold">Nom</label>
                            <p id="nom" class="form-control-plaintext">Jean</p>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-semibold">Prénom</label>
                            <p id="prenom" class="form-control-plaintext">Dupont</p>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Email</label>
                        <p id="email" class="form-control-plaintext">jean.dupont@example.com</p>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Adresse de livraison</label>
                        <input type="text" class="form-control" id="adresse" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Adresse sur la carte</label>
                        <div id="map" style="height: 250px;" class="rounded border"></div>
                    </div>
                </div>

                <div class="bg-white rounded shadow p-4 mb-4">
                    <h2 class="fw-bold mb-3">Payer avec PayPal</h2>
                    <div class="text-center">
                        <div id="paypal-button-container" class="mt-3"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer id="printFooter"></footer>

    <script>
        componentsLoader("../components/header.html", "printHeader");
        componentsLoader("../components/footer.html", "printFooter");
        handleNavbar(991.9);
    </script>
    <script src="../assets/js/achat.js" type="module"></script>
</body>
</html>
