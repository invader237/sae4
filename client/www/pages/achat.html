<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Commande</title>
    <link rel="stylesheet" href="../assets/css/styles.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="../assets/js/componentsLoader.js"></script>
</head>
<body>
    <div id="printHeader"></div>

    <div class="container py-5 h-100">
        <div class="row g-4 h-100">

            <!-- Récapitulatif de la commande -->
            <div class="col-lg-6 d-flex flex-column h-100">
                <div class="bg-white rounded shadow-sm p-4 h-100 d-flex flex-column">
                    <h2 class="fw-bold mb-4">Récapitulatif de la commande</h2>
                    <ul id="orderSummaryList" class="list-group overflow-auto" style="flex-grow: 1; max-height: 625px;"></ul>
                    <hr>
                    <div class="d-flex justify-content-between">
                        <span class="fw-bold fs-5">Total articles :</span>
                        <span class="fw-bold fs-5"><span id="prixTotal">0</span> €</span>
                    </div>
                    <div class="d-flex justify-content-between mt-2">
                        <span class="fw-bold fs-6">Frais de livraison :</span>
                        <span class="fw-bold fs-6"><span id="livraisonFrais">0</span> €</span>
                    </div>
                    <hr>
                    <div class="d-flex justify-content-between">
                        <span class="fw-bold fs-4">Total à payer :</span>
                        <span class="fw-bold fs-4 text-success"><span id="totalAPayer">0</span> €</span>
                    </div>
                </div>
            </div>

            <!-- Informations client -->
            <div class="col-lg-6 d-flex flex-column h-100">
                <div class="bg-white rounded shadow-sm p-4 mb-4">
                    <h2 class="fw-bold mb-3">Informations client</h2>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Nom</label>
                        <p id="nom" class="form-control-plaintext">Jean</p>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Prénom</label>
                        <p id="prenom" class="form-control-plaintext">Dupont</p>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Email</label>
                        <p id="email" class="form-control-plaintext">jean.dupont@example.com</p>
                    </div>
                    <div class="mb-3">
                        <label for="adresse" class="form-label">Adresse de livraison</label>
                        <input type="text" class="form-control" id="adresse" rows="3" required></textarea>
                    </div>
                </div>

                <div class="bg-white rounded shadow-sm p-4 mb-4">
                    <h2 class="fw-bold mb-3">Type de livraison</h2>
                    <select class="form-select form-select-sm py-2 px-3" id="livraison" style="min-height: 40px;>
                        <option value="standard" data-frais="4">Standard - 4 €</option>
                        <option value="express" data-frais="8">Express - 8 €</option>
                        <option value="relais" data-frais="3">Point relais - 3 €</option>
                    </select>
                </div>

                <div class="bg-white rounded shadow-sm p-4 mb-4">
                    <h2 class="fw-bold mb-3">Moyen de paiement</h2>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="paiement" id="paypal" checked>
                        <label class="form-check-label" for="paypal">PayPal Sandbox (test)</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="paiement" id="cb" disabled>
                        <label class="form-check-label text-muted" for="cb">Carte bancaire (bientôt disponible)</label>
                    </div>
                </div>

                <div class="text-end">
                    <button class="btn btn-success btn-lg" id="validerCommande">Valider et Payer</button>
                </div>
            </div>
        </div>
    </div>

    <footer id="printFooter"></footer>

    <script>
        componentsLoader("../components/header.html", "printHeader");
        componentsLoader("../components/footer.html", "printFooter");
    </script>
    <script src="../assets/js/achat.js" type="module"></script>
</body>
</html>
