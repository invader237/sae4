<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Profil</title>
  <link rel="stylesheet" href="../assets/css/styles.css" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous" />
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.min.js"></script>
  <script src="../assets/js/componentsLoader.js"></script>
  <script src="../assets/js/profil.js" type="module"></script>
  <style>
    @media (max-width: 768px) {
      .profile-header {
        flex-direction: column !important;
        align-items: center !important;
      }

      .profile-header .text-center {
        margin-bottom: 1.5rem;
      }
    }
  </style>
</head>

<body class="bg-light d-flex flex-column min-vh-100">
  <div id="printHeader"></div>

  <main class="container py-5 flex-grow-1">
    <div class="card shadow-lg border-0 rounded-4 p-4 mx-auto bg-light" style="max-width: 1000px;">
      <div class="container d-flex justify-content-between align-items-center profile-header flex-wrap">
        <div class="text-center mb-4">
          <img src="../assets/img/profile.png" alt="Photo de profil" class="rounded-circle shadow" style="width: 120px; height: 120px; object-fit: cover;">
          <h2 class="mt-3">Mon Profil</h2>
        </div>

        <form id="profileForm" style="background-color: transparent !important; width: 100%;">
          <div class="row g-4">
            <div class="col-md-6 col-lg-4">
              <label for="inputName" class="form-label">Nom</label>
              <input type="text" class="form-control" id="inputName" disabled />
            </div>
            <div class="col-md-6 col-lg-4">
              <label for="inputFirstName" class="form-label">Prénom</label>
              <input type="text" class="form-control" id="inputFirstName" disabled />
            </div>
            <div class="col-md-6 col-lg-4">
              <label for="inputCiv" class="form-label">Civilité</label>
              <input type="text" class="form-control" id="inputCiv" disabled />
            </div>
            <div class="col-md-6 col-lg-4">
              <label for="inputBirthDate" class="form-label">Date de naissance</label>
              <input type="date" class="form-control" id="inputBirthDate" disabled />
            </div>
            <div class="col-12 col-lg-8">
              <label for="inputMail" class="form-label">Adresse e-mail</label>
              <input type="email" class="form-control" id="inputMail" disabled />
            </div>
          </div>
        </form>
      </div>

      <div class="row mt-5 g-3">
        <div class="col-md-6 d-grid">
          <button type="button" id="changePassword" class="btn btn-outline-primary">Changer le mot de passe</button>
        </div>
        <div class="col-md-6 d-grid">
          <button type="button" id="editBtn" class="btn btn-outline-primary" title="Fonctionnalité en développement" disabled>Modifier les informations</button>
          <div id="editActionBtn" class="row g-2 d-none mt-3">
            <div class="col-12 col-md-6">
              <button type="submit" id="saveBtn" class="btn btn-success w-100 d-none">Enregistrer</button>
            </div>
            <div class="col-12 col-md-6">
              <button type="button" id="cancelBtn" class="btn btn-secondary w-100 d-none">Annuler</button>
            </div>
          </div>
        </div>
      </div>

      <div class="row g-3 mt-3">
        <div class="col-md-12 d-grid">
          <a href="commande.html" class="btn btn-outline-secondary">Voir mes commandes</a>
        </div>
      </div>

      <hr class="my-5">

      <div class="row g-3">
        <div class="col-md-6 d-grid">
          <button id="logout" class="btn btn-outline-danger">Déconnexion</button>
        </div>
        <div class="col-md-6 d-grid">
          <button id="deleteAccount" class="btn btn-danger" title="Fonctionnalité en développement" disabled>Supprimer le compte</button>
        </div>
      </div>
    </div>
  </main>

  <footer id="printFooter"></footer>
  <script>
    componentsLoader("../components/header.html", "printHeader");
    componentsLoader("../components/footer.html", "printFooter");
  </script>
  <script type="module" src="../assets/js/header.js"></script>
</body>

</html>
