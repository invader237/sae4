<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Mes Commandes</title>
        <link rel="stylesheet" href="../assets/css/styles.css">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.min.js"></script>
        <link rel="stylesheet" href="../assets/css/commande.css" />
        <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
        <script src="../assets/js/componentsLoader.js"></script>
        <script src="../assets/js/header.js" type="module"></script>
    </head>
<body class="bg-light">
    <div id="printHeader"></div>

    <main class="container my-5">
        <div class="bg-white p-4 rounded mb-4">
            <h1 class="text-center fw-bold mb-0">Mes commandes</h1>
        </div>
        <div class="p-0">
            <div class="table-responsive">
                    <table class="table table-bordered table-striped align-middle text-center table-hover rounded-3 overflow-hidden shadow-sm">
                    <thead class="table-dark text-uppercase">
                        <tr class="align-middle">
                            <th scope="col">ID</th>
                            <th scope="col">Date</th>
                            <th scope="col">ID Paiement</th>
                            <th scope="col">Adresse de livraison</th>
                            <th scope="col">Type de livraison</th>"
                            <th scope="col">Prix</th>
                        </tr>
                    </thead>
                    <tbody id="ordersTableBody">
                        <!-- Les lignes de commande seront injectées ici dynamiquement -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <footer id="printFooter"></footer>

    <script>
        componentsLoader("../components/header.html", "printHeader");
        componentsLoader("../components/footer.html", "printFooter");
    </script>
    <script src="../assets/js/commande.js" type="module"></script>
</body>
</html>
