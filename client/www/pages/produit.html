<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Détail du Produit</title>
    <link rel="stylesheet" href="../assets/css/styles.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="../assets/js/componentsLoader.js"></script>
    <script src="../assets/js/header.js" type="module"></script>
</head>

<body class="bg-light">
    <div id="printHeader"></div>

    <main class="container my-5">
        <div class="card shadow-lg rounded-4 overflow-hidden">
            <div class="row g-0">
                <div class="col-lg-6 bg-success text-white d-flex flex-column justify-content-center align-items-center p-4">
                    <h1 class="card-title text-center mb-4">Détails du Produit</h1>
                    <img id="imgProduit" class="img-fluid rounded shadow-sm mb-3" alt="Image du produit" src="../assets/img/Placeholder.png"
                        style="max-height: 300px; object-fit: contain;">
                    <p class="desc_prod text-center px-3"></p>
                </div>
                <div class="col-lg-6 p-4">
                    <div class="mb-3">
                        <p class="fs-5">SKU : <span id="sku" class="fw-semibold">Work in progress</span></p>
                        <p class="fs-5">Prix : <span id="prix" class="fw-semibold"></span> €</p>
                        <div class="mb-2">
                            <label class="form-label">Taille :</label>
                            <div id="taille" class="d-block"></div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Couleur :</label>
                            <div id="couleur" class="d-block"></div>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="nbrCommande" class="form-label">Quantité :</label>
                        <input type="number" id="nbrCommande" name="nbrCommande"
                            class="form-control w-50 d-inline-block me-2" step="1" value="1" min="1" required>
                        <p class="mt-2">En stock : <span id="nbrStock"></span></p>
                    </div>

                    <div class="mb-3">
                        <p class="fs-5">Prix total : <span id="prix_tot" class="fw-bold"></span>€</p>
                    </div>


                        <div class="d-flex row">
                            <div class="d-flex gap-2 mt-3">
                            <input type="button" id="ajouterPanier" class="btn btn-success w-100 py-2 fw-semibold btn-lg"
                                value="Ajouter au panier">

                            <button class= "btn btn-success add-to-fav-btn btn-lg"
                                data_product_id=""
                                data_size_id="" 
                                data_color_id="">
                                <img src="../assets/img/icones/star_vide.png" style="width: 20px; height: 20px; margin: 5px;" alt="Ajouter aux favoris">
                            </button>               
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer id="printFooter"></footer>

    <script src="../assets/js/produit.js" type="module"></script>
    <script>
        componentsLoader("../components/header.html", "printHeader");
        componentsLoader("../components/footer.html", "printFooter");
    </script>
</body>

</html>
