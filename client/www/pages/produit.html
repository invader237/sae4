<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title></title>
    <link rel="stylesheet" href="../assets/css/styles.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="../assets/js/componentsLoader.js"></script>
    <script src="../assets/js/header.js" type="module"></script>
</head>

<body>
    <div id="printHeader"></div>

    <div id="detail container my-5">
        <div class="produitDetail card shadow-lg rounded-3 p-4 bg-success text-white text-center mx-auto mb-4" style="max-width: 800px;">
            <h1 class="mb-3"></h1>
            <span class="main_info_prod row g-4 align-items-center">
                <div class="col-md-6 text-center">
                    <img class="img_prod img-fluid rounded" alt="Image du produit" src="../assets/img/Placeholder.png" style="max-width: 400px; max-height: 300px; margin: 5px; vertical-align: top; max-width: 100%; height: auto; width: auto; aspect-ratio: auto; border-radius: 4px;">
                </div>
                <div class="col-md-6">
                    <p class="desc_prod" style="max-width: 400px; max-height: 300px; margin: 5px; vertical-align: top;"></p>
                </div>
            </span>
            <br>
            <div class="sub_info_prod row g-3" style="grid-template-columns: repeat(auto-fill, 380px);">
                <div class="col-md-6 text-center">
                    <button class= "btn btn-success add-to-fav-btn"
                        data_product_id=""
                        data_size_id="" 
                        data_color_id="">
                        <img src="../assets/img/icones/star_vide.png" style="width: 20px; height: 20px; margin: 5px;" alt="Ajouter aux favoris">
                    </button>               
                    <p class="fs-5">SKU : <span id="sku">Work in progress</span> </p>
                    <p class="fs-5">prix : <span id="prix"></span> €</p>
                    <div id="taille" class="d-inline-block">Taille : </div>
                    <div id="couleur" class="d-inline-block">Couleur : </div>
                </div>
                <div class="col-md-6 text-center mt-4">
                    <label class="d-inline-block form-label" for="nbrCommande">Quantité :</label>
                    <input type="number" id="nbrCommande" name="nbrCommande" class="form-control w-25 bg-light border-0 d-inline-block" step="1" value="1" size="5" required>
                    <label for="nbrCommande">En stock : <span id="nbrStock"></span></label>
                    <p class="fs-5">Prix total : <span id="prix_tot"></span>€</p>
                    <label for="ajouterPanier" class="ajouterPanierLabel"></label>
                    <input type="button" id="ajouterPanier" class="btn btn-light text-dark w-auto py-2 px-4 my-2 border-0 rounded" value="Ajouter au panier">
                </div>
            </div>
        </div>
    </div>

    <footer id="printFooter"></footer>
</body>

<script src="../assets/js/produit.js" type="module"></script>
<script>
    componentsLoader("../components/header.html", "printHeader");
    componentsLoader("../components/footer.html", "printFooter");
</script>
</html>
