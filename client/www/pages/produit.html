<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title></title>
    <link rel="stylesheet" href="../assets/css/styles.css">
    <link rel="stylesheet" href="../assets/css/produit.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="../assets/js/componentsLoader.js"></script>
    <script src="../assets/js/header.js"></script>
</head>

<body>
    <div id="printHeader"></div>

    <div id="detail">
        <div class="produitDetail">
            <center><h1></h1></center>
            <span class="main_info_prod">
                <center><img class="img_prod" alt="../img/Placeholder.png" src=""></center>
                <center><p class="desc_prod"></p></center>
            </span>
            <br>
            <div class="sub_info_prod">
                <div style="margin-bottom: 15px;">
                    <p>SKU : <span id="sku">Work in progress</span> </p>
                    <p>prix : <span id="prix"></span> €</p>
                    <div id="taille">Taille : </div>
                    <div id="couleur">Couleur : </div>
                </div>
                <div>
                    <label for="nbrCommande">Quantité :</label>
                    <input type="number" id="nbrCommande" name="nbrCommande" step="1" value="1" size="5" required>
                    <label for="nbrCommande">En stock : <span id="nbrStock"></span></label>
                    <p>Prix total : <span id="prix_tot"></span>€</p>
                    <label for="ajouterPanier" class="ajouterPanierLabel"></label>
                    <input type="button" id="ajouterPanier" value="Ajouter au panier">
                </div>
            </div>
        </div>
    </div>

    <footer id="printFooter"></footer>
</body>

<script src="../assets/js/produit.js" type="module"></script>
<script>
    componentsLoader("../components/header.html", "printHeader");
    componentsLoader("../components/footer.html", "printFooter");
    handleNavbar(991.9);
</script>
