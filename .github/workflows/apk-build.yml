#          mkdir -p $GITHUB_WORKSPACE/apk
#          find client/platforms/android/app/build/outputs/apk/ -name "*.apk" -exec cp {} $GITHUB_WORKSPACE/apk/ \;
#      
      - name: temp
        run: |
          echo ${{ secrets.TOKEN }}
          echo ${{ secrets.GITHUB_TOKEN }}
          mkdir -p apk
          echo "Hello World" > apk/hello.apk

      - name: Configure Git login
        run: |
          git config --global user.email "${{ secrets.EMAIL }}"
          git config --global user.name "${{ secrets.USERNAME }}"

      - name: Commit and push APK
        run: |
          git add apk/*.apk
          git commit -m ":rocket:(APK): Build APK"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.TOKEN }}
