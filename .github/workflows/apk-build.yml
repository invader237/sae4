name: Build Cordova APK (Manual)

on:
  workflow_dispatch:  # Déclenchement manuel

jobs:
  build:
    runs-on: ubuntu-latest
    environment: sae4
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true 

